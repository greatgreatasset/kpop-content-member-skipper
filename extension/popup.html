<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <h1>K-pop Content Member Skipper</h1>
  <p id="profile" class="hint"></p>
  <label class="row"><span>Skipping</span><input type="checkbox" id="enabled"></label>
  <label class="row"><span id="hlLabel">Highlights</span><input type="checkbox" id="highlights"></label>
  <p id="status" class="status">…</p>
  <button id="nextHl" hidden>Jump to next highlighted part</button>
  <div id="scan" hidden>
    <button id="scanBtn" hidden>Filter this video</button>
    <progress id="scanBar" max="100" value="0" hidden></progress>
    <p id="scanText" class="hint"></p>
  </div>
  <p class="foot"><a href="#" id="options">Settings</a> · Alt+Shift+H = next highlight</p>
  <script src="rules.js"></script>
  <script src="popup.js"></script>
</body>
</html>
